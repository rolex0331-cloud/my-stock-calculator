# Operational cron only. Does not change the stock calculator app.
# Public Bitget CLOSED candles -> existing TAEPYEONG R4 Shadow simulator.
# No exchange credentials, no orders, no repo write permissions.
name: TAEPYEONG R4 Shadow 5m Feed

on:
  schedule:
    # Avoid the top of every hour; GitHub may delay or drop scheduled jobs.
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r4-shadow-public-candles
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Collect public completed 5m candles and verify virtual ledger status
        env:
          R4_BASE: https://taepyeong-r4-shadow.floot.app
          R4_RUN_KIND: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          from datetime import datetime, timezone
          import urllib.request
          import urllib.error

          base = os.environ["R4_BASE"]

          def get(path):
              req = urllib.request.Request(
                  base + path, headers={"Accept": "application/json", "Cache-Control": "no-store", "User-Agent": "R4-Public-Feed/1.0"}
              )
              with urllib.request.urlopen(req, timeout=80) as resp:
                  body = json.loads(resp.read(1_000_000))
              if not isinstance(body, dict):
                  raise RuntimeError("BAD_JSON_OBJECT")
              return body.get("json", body)

          try:
              event_kind = os.environ.get("R4_RUN_KIND", "unknown")
              if event_kind not in ("schedule", "workflow_dispatch"):
                  raise RuntimeError("UNEXPECTED_WORKFLOW_TRIGGER")
              source_hint = "watch" if event_kind == "schedule" else "github-manual"
              print("TRIGGER:", event_kind, "- only schedules may count as scheduled runs")
              result = get("/_api/shadow-cycle?source=" + source_hint)
              if result.get("ok") is not True:
                  raise RuntimeError("COLLECTION_REPORTED_FAILURE")
              if result.get("skipped"):
                  print("SKIPPED:", result.get("reason", "rate guard"), "- no new candle collection claimed")
              else:
                  run = result.get("run") or {}
                  if run.get("symbolsOk") != 3:
                      raise RuntimeError("INCOMPLETE_THREE_SYMBOL_CYCLE")
                  checks = run.get("dataFreshness") or {}
                  required = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
                  if set(checks) != set(required):
                      raise RuntimeError("MISSING_SYMBOL_FRESHNESS")
                  print("STORED:", {s: checks[s].get("appendedBars") for s in required},
                        "run:", run.get("runId"))
              state = get("/_api/shadow-status")
              health = state.get("monitorHealth") or {}
              audit = state.get("tradeLifecycle") or {}
              print("MARKETS:", [a.get("symbol") for a in (state.get("accounts") or [])],
                    "health:", health.get("status"),
                    "paper entries:", audit.get("entryCount"),
                    "paper exits:", audit.get("exitCount"))
              # Independent research preview of the LAST actually closed 5m bar.
              # Its provisional marker is never saved and it never places orders.
              # Read-only best effort: deployment may lag this workflow change.
              try:
                  ahead = get("/_api/shadow-ahead")
                  if ahead.get("mode") != "RESEARCH_PREVIEW_ONLY" or ahead.get("noOrdersSent") is not True:
                      raise RuntimeError("UNTRUSTED_PREVIEW_RESPONSE")
                  if ahead.get("strategyHash") != state.get("strategyHash"):
                      raise RuntimeError("AHEAD_FROZEN_HASH_MISMATCH")
                  observed = ahead.get("observations") or []
                  for row in observed:
                      sig = row.get("signal")
                      if sig is not None:
                          print("R4 CLOSED-BAR RESEARCH CANDIDATE:",
                                row.get("symbol"), sig.get("id"),
                                "state:", row.get("state"),
                                "model-open lag ms:", row.get("observedAfterModeledOpenMs"),
                                "NO actual next-open or demo fill")
              except (urllib.error.URLError, ValueError, RuntimeError) as preview_error:
                  print("R4 research-preview unavailable; core 5m collection still assessed separately:",
                        str(preview_error)[:120])
              if len(state.get("accounts") or []) != 3:
                  raise RuntimeError("ACCOUNT_COUNT_INVALID")
              if health.get("lastRunStatus") in ("failed", "blocked"):
                  raise RuntimeError("LATEST_CYCLE_FAILED")
              if audit.get("stage") == "AUDIT_ALERT" or audit.get("issues"):
                  raise RuntimeError("PAPER_LEDGER_AUDIT_ALERT")
              if (audit.get("entryCount") or 0) > 0:
                  p = state.get("observationProvenance") or {}
                  recent = p.get("recent") or []
                  now_ms = time.time() * 1000
                  just_recorded = any(0 <= now_ms - float(e.get("recordedAt") or 0) < 12 * 60_000 for e in recent)
                  hourly_audit = datetime.now(timezone.utc).minute < 9
                  if just_recorded or hourly_audit:
                      check = get("/_api/shadow-reconcile")
                      if check.get("passed") is not True or check.get("symbolsChecked") != 3:
                          raise RuntimeError("FROZEN_R4_RECONCILIATION_MISMATCH")
                      print("INDEPENDENT LEDGER: all 3 symbols matched")
                      if (p.get("lateOver1h") or 0) > 0:
                          print("RETROSPECTIVE: some paper events were first seen >1h late; not real fills")
              if (p if (audit.get("entryCount") or 0) > 0 else {}).get("invalidTimestamps", 0):
                  raise RuntimeError("INVALID_PAPER_EVENT_RECORD_TIMESTAMP")
              if health.get("collectionState") in ("STOPPED", "FAILED", "NOT_STARTED", "STUCK"):
                  raise RuntimeError("COLLECTION_NO_LONGER_RUNNING")
              if not result.get("skipped") and health.get("status") != "FRESH":
                  raise RuntimeError("NEW_COLLECTION_NOT_FRESH")
          except (urllib.error.URLError, ValueError, RuntimeError) as error:
              print("R4 SHADOW FEED FAILED:", str(error)[:250], file=sys.stderr)
              sys.exit(1)
          PY
